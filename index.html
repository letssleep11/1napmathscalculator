<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#F8FAF9;font-family:'DM Sans',-apple-system,sans-serif;color:#1A3440}
textarea{resize:vertical;font-family:inherit}
input,button{font-family:inherit}
@keyframes ls-spin{to{transform:rotate(360deg)}}
@keyframes ls-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:ls-fade 0.35s ease both}
.inp{width:100%;padding:12px 14px;border:1.5px solid #D4E6E3;border-radius:10px;background:#fff;color:#1A3440;font-size:16px;outline:none;line-height:1.5;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:#2D5F6E;box-shadow:0 0 0 3px #EDF5F4}
.inp-time{text-align:center;padding:11px 12px;font-size:15px}
.btn-primary{width:100%;padding:16px 20px;background:#2D5F6E;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;transition:background .2s}
.btn-primary:hover{background:#244e5c}
.btn-ghost{width:100%;padding:14px 18px;background:#fff;color:#4A6670;border:1.5px solid #D4E6E3;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-ghost:hover{background:#EDF5F4}
.step+.step{border-top:1.5px solid #D4E6E3}
.serif{font-family:'Playfair Display',Georgia,serif}
@media(max-width:600px){
  .header-title{font-size:30px!important}
  .header-sub{font-size:14px!important}
  .body{padding:18px 14px 0!important}
  .card{padding:18px 14px!important}
  .grid-2{grid-template-columns:1fr!important}
  .grid-3{grid-template-columns:1fr 1fr 1fr!important}
  .grid-time{grid-template-columns:1fr!important}
  .headline{font-size:20px!important}
}
</style>

TROUBLESHOOTING RULES:
BRIDGING NAPS: 10–15 min assisted nap (pram/car/carrier/held). Only for babies under 7 months. Must be offered exactly halfway between when baby woke and the next desired nap time — NOT halfway between wake time and 6am. For example: woke 5am, next nap 9:30am → bridging nap at 7:15–7:30am. Must be at least 45–60 min before the next nap. Best done in pram, car, carrier or held.

4–6 MONTH RULES:
Early wake before 6:30am: offer bridging nap halfway between wake time and morning nap. If refused, move morning nap 10–15 min earlier. Never before 8:45am.
Morning nap refused (not asleep by 10/10:15am): offer assisted nap 15–20 min between 10–11am, then lunch 10–15 min earlier. If also refused, offer lunch 20–30 min earlier.
Morning nap early: let baby sleep 10–15 extra min. If woke before 9:30am, offer bridging nap halfway to lunch.
Morning nap late: wake by 10:15–10:30am even if only 15–20 min. If not asleep until 10:30am: cap at 15–20 min, treat as bridging, offer lunch usual or slightly earlier.
Lunch nap short/early: bridging nap 2:30–3pm, then 3rd nap 4–5pm.
Lunch nap late: wake by 2:30pm to fit 3rd nap.
3rd nap refused: keep trying until 5/5:15pm, then early bedtime 6/6:15pm.
3rd nap short (under 15–20 min): bedtime 6/6:15pm.

Lunch refused: bridging nap 2:30–2:45pm, 3rd nap 4–5pm (cap 30 min), bedtime 6/6:15pm.

Lunch nap short (under 60 min): early bedtime 6:30pm.
Lunch nap late: wake by 3pm, bedtime 3.5 hours later.

2 YEAR RULES (1 nap or quiet time):
Lunch nap at 12:30pm, cap at 90 min.
Early wake: keep nap at usual time.
Nap refused: early bedtime 6:30–6:45pm. Offer quiet time instead.
Nap short (under 45 min): early bedtime 6:30pm.
Nap dropping (~2.5 years): bring bedtime to 6:30–6:45pm permanently.

ALWAYS: If troubleshooting goes to plan and baby is on track for their usual 3rd nap timing, bedtime can be at the usual time. If things have continued to not go to plan, an early bedtime is the very best tool. Every day is a fresh start — tomorrow go back to usual routine as if today didn't happen. Be mindful not to get baby up early as this reinforces early waking.
TIP1 GUIDANCE: If baby is fighting naps today, lean on motion — pram or car are completely valid, not creating bad habits, just meeting them where they're at.
TIP2 GUIDANCE: Watch for overtiredness cues — red eyebrows, glazed eyes, or frantic energy. On early wake days these can come faster than usual, trust what you see over the clock.
TIP3 GUIDANCE: One early morning does not set a new pattern. Every day is a fresh start and tomorrow go back to the usual routine as if today didn't happen. Be mindful not to get baby up early as this reinforces early waking.

IMPORTANT WORDING RULES:
- HEADLINE must always be warm and addressed to the PARENT, never the baby. You MUST vary the headline every single time — it is critical that you do NOT repeat the same opener. Before writing the headline, mentally check: is this the same phrase I might default to? If yes, choose a completely different one.

  Here are 15 openers to rotate through — pick one that fits the situation and has NOT been used recently:
  1. "Ahh all good! Let's make a plan for the rest of [name]'s day."
  2. "Totally fixable — here's your plan for the rest of [name]'s day."
  3. "You've got this! Let's work out the rest of [name]'s day together."
  4. "This is such a common one — here's exactly what I'd do with [name] today."
  5. "No need to panic at all — let's just adjust and keep moving."
  6. "Every parent has days like this. Here's how to course correct for [name]."
  7. "One off day doesn't mean anything is broken. Here's the plan."
  8. "We've got this — here's exactly what I'd do with [name] today."
  9. "Happens to everyone! Let's sort [name]'s day out."
  10. "Good news: this is completely fixable. Here's the plan for [name]."
  11. "Take a breath — we've got a plan. Here's how I'd navigate the rest of [name]'s day."
  12. "This is so manageable. Here's what I'd do from here with [name]."
  13. "Honestly? This one's easy to work with. Here's the plan for [name]."
  14. "Don't stress about this at all — here's how I'd handle [name]'s day from here."
  15. "You're in the right place! Here's your plan for the rest of [name]'s day."

  STRICT RULE: Do NOT use "Don't stress — this happens! Here's how I'd handle the rest of [name]'s day" — this phrase is retired. Always write in Jazz's warm, direct, non-judgmental voice.
- NEVER mention food, milk, feeds, solids, lunch (as a meal), or any feeding advice. This tool is ONLY about nap and sleep timing.
- For lunch nap: always say "Wake by 2:30pm at the latest so there's room for the 3rd nap." Nothing else about timing or food.
- For 3rd nap after a good lunch nap: always say "offer a 3rd nap at around 4:30pm as per usual."
- For babies 8 months and older: do NOT include a 3rd nap step. 8 month olds are on 2 naps only — morning nap and lunch nap. Never suggest a 3rd nap for babies 8 months+.
- Keep BEDTIME to 1–2 short sentences maximum. Simple and direct. Never add phrases like "it's not a punishment" or "it's just smart sleep" — just state the bedtime plainly and warmly.
- When describing what to do at bedtime, always say "move straight into her usual evening routine (feed, bath, top up, bedtime)" — this is the only context where feed/bath is mentioned.

- Never suggest a nap longer than 2–2.5 hours. If a nap would go past that, advise waking the baby.
- If the user's situation describes pre-planning for an event or activity (e.g. an appointment, outing, or early start), detect this and provide TWO OPTIONS for how to adjust the day — label them Option A and Option B — so the parent can choose what works best for them.
- NEVER give any advice about how to settle a baby or get them to sleep. This tool is ONLY about TIMING of naps — when to offer, when to cap, when to skip. No settling techniques.
- Age group: if a child is 2 years and 1+ months, the age group is "2–3 years". The 2yr rules still apply but label the group correctly.

RESPONSE FORMAT — use these exact markers, no markdown, no asterisks:
HEADLINE: [one warm sentence addressed to the parent, e.g. "Ahh all good! Let's make a plan for the rest of [name]'s day."]
AGEINFO: [one sentence about age group and what it means for today]
STEPS: [numbered steps, each on its own line. If pre-planning: give OPTION A: then steps, then OPTION B: then steps]
BEDTIME: [1–2 short sentences only]`;

const STORAGE_KEY = "letsleep_routine_v1";
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||{};}catch{return{};}}
function saveRoutine(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({
    name:state.name,years:state.years,months:state.months,weeks:state.weeks,
    wakeTime:state.wakeTime,nap1:state.nap1,nap2:state.nap2,nap3:state.nap3,bedTime:state.bedTime
  }));}catch{}

// ── Age helpers ─────────────────────────────────────────────────
function totalMonths(){
  return (parseInt(state.years)||0)*12+(parseInt(state.months)||0)+(parseInt(state.weeks)||0)/4;
}
function ageGroupLabel(m){
  if(m<6) return"4–6 months";
  if(m<8) return"6–8 months";
  if(m<12)return"8–12 months";
  if(m<18)return"12–18 months";
  if(m<24)return"18m–2 years";
  return"2–3 years";
}
function awakeLabel(m){
  if(m<5) return"1h 45m – 2h";
  if(m<7) return"2h 30m";
  if(m<12)return"2h 30m – 3h";
  return"5–6h (1 nap)";
}
function napsLabel(m){
  if(m<7.5)return"2–3";
  if(m<15) return"2";
  if(m<21) return"1";
  return"1 or quiet time";
}

// ── Response parser ─────────────────────────────────────────────
function parseResponse(text,m){
  function get(key){
    const re=new RegExp(key+":\\s*([\\s\\S]+?)(?=\\n[A-Z]+:|$)");
    const match=text.match(re);
    return match?match[1].trim():"";
  }
  const steps=get("STEPS").split(/\n/).map(s=>s.replace(/^\d+\.\s*/,"").trim()).filter(Boolean);
  return{
    headline:get("HEADLINE"),ageInfo:get("AGEINFO"),steps,bedtime:get("BEDTIME"),
    stats:[
      {label:"Age group",value:ageGroupLabel(m)},
      {label:"Awake windows",value:awakeLabel(m)},
      {label:"Naps today",value:napsLabel(m)}
    ]
  };
}

function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k==="className")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  if(children)([].concat(children)).forEach(c=>{
    if(c==null)return;
    e.append(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
  });
  return e;
}
function div(attrs,children){return el("div",attrs,children);}
function p(attrs,children){return el("p",attrs,children);}

}

async function recalibrate(){
  if(!state.recalibrateInput.trim()){
    state.error="Please add some extra information so we can adjust the plan.";
    render();return;
  }
  if(state.recalibrateCount>=3){
    state.showRestartPopup=true;
    render();return;
  }
  state.error="";state.view="loading";render();

  const babyName=state.name.trim()||"your baby";
  const ageParts=[state.years&&state.years+" year"+(state.years!=="1"?"s":""),state.months&&state.months+" month"+(state.months!=="1"?"s":""),state.weeks&&state.weeks+" week"+(state.weeks!=="1"?"s":"")].filter(Boolean);
  const ageStr=ageParts.join(" and ")||"unknown age";
  const routine=[state.wakeTime&&"Wake up: "+state.wakeTime,state.nap1&&"Nap 1: "+state.nap1,state.nap2&&"Nap 2: "+state.nap2,state.nap3&&"Nap 3: "+state.nap3,state.bedTime&&"Bedtime: "+state.bedTime].filter(Boolean).join(", ")||"not provided";
  const msg="Baby name: "+babyName+"\nAge: "+ageStr+"\nUsual routine: "+routine+"\nOriginal situation: "+state.situation+"\n\nPrevious plan given:\n"+state.previousPlan+"\n\nAdditional information from parent: "+state.recalibrateInput+"\n\nUsing the previous plan as context and the new information provided, please revise and improve the plan. Keep what was working and adjust what needs to change.";

  const m=totalMonths();
  try{
    const data=await callAPI(SYSTEM_PROMPT,[{role:"user",content:msg}]);
    const text=(data.content||[]).map(b=>b.text||"").join("");
    const parsed=parseResponse(text,m);
    parsed.babyName=babyName;parsed.ageStr=ageStr;
    state.recalibrateCount++;
    state.result=parsed;
    state.recalibrating=false;
    state.recalibrateInput="";
    state.view="results";
    setTimeout(launchConfetti,200);
  }catch(e){
    console.error("Recalibrate error:",e);
    state.error="Something went wrong — please try again. ("+e.message+")";state.view="results";
  }
  render();
}



function launchConfetti(){
  const canvas=document.createElement("canvas");
  canvas.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999";
  document.body.appendChild(canvas);
  const ctx=canvas.getContext("2d");
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const colors=["#E0126B","#2D5F6E","#8BBFB8","#F472A8","#F0A500","#EDF5F4","#ffffff"];
  const pieces=[];
  for(let i=0;i<140;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:-10-Math.random()*canvas.height*0.5,
      w:8+Math.random()*8,
      h:5+Math.random()*5,
      r:Math.random()*Math.PI*2,
      dr:0.05+Math.random()*0.15,
      vx:-2+Math.random()*4,
      vy:2+Math.random()*4,
      color:colors[Math.floor(Math.random()*colors.length)],
      opacity:1
    });
  }
  let start=null;
  const dur=3200;
  function draw(ts){
    if(!start)start=ts;
    const elapsed=ts-start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      p.r+=p.dr;
      p.vy+=0.06;
      p.opacity=elapsed>2200?Math.max(0,1-(elapsed-2200)/1000):1;
      ctx.save();
      ctx.globalAlpha=p.opacity;
      ctx.translate(p.x+p.w/2,p.y+p.h/2);
      ctx.rotate(p.r);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(elapsed<dur) requestAnimationFrame(draw);
    else canvas.remove();
  }
  requestAnimationFrame(draw);
}

async function callAPI(system, messages){
  // Try /api/plan proxy first (Vercel production)
  try {
    const res = await fetch("/api/plan", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({system, messages})
    });
    if(res.ok){
      return await res.json();
    }
  } catch(e){}

  // Fall back to direct Anthropic API (testing/sidebar)
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "anthropic-version":"2023-06-01"
    },
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1200,
      system,
      messages
    })
  });
  return await res.json();
}

async function submit(){
  if(!state.situation.trim()){
    state.error="Please describe what's happened today or what you need help planning.";
    render();return;
  }
  const m=totalMonths();
  if(m>0&&m<4){
    state.error="This tool is designed for babies 4 months and older.";
    render();return;
  }
  saveRoutine();
  state.recalibrateCount=0;
  state.error="";state.view="loading";render();

  const babyName=state.name.trim()||"your baby";
  const ageParts=[state.years&&state.years+" year"+(state.years!=="1"?"s":""),state.months&&state.months+" month"+(state.months!=="1"?"s":""),state.weeks&&state.weeks+" week"+(state.weeks!=="1"?"s":"")].filter(Boolean);
  const ageStr=ageParts.join(" and ")||"unknown age";
  const routine=[state.wakeTime&&"Wake up: "+state.wakeTime,state.nap1&&"Nap 1: "+state.nap1,state.nap2&&"Nap 2: "+state.nap2,state.nap3&&"Nap 3: "+state.nap3,state.bedTime&&"Bedtime: "+state.bedTime].filter(Boolean).join(", ")||"not provided";
  const msg="Baby name: "+babyName+"\nAge: "+ageStr+"\nUsual routine: "+routine+"\nSituation today: "+state.situation+"\n\nPlease give a full troubleshooting plan (or pre-plan with two options if planning ahead).";

  try{
    const data=await callAPI(SYSTEM_PROMPT,[{role:"user",content:msg}]);
    const text=(data.content||[]).map(b=>b.text||"").join("");
    const parsed=parseResponse(text,m);
    parsed.babyName=babyName;parsed.ageStr=ageStr;
    state.previousPlan=state.situation+"\n\nPlan steps: "+parsed.steps.join(" | ")+"\nBedtime: "+parsed.bedtime;
    state.result=parsed;state.view="results";
    setTimeout(launchConfetti,200);
  }catch(e){
    console.error("Submit error:",e);
    state.error="Something went wrong — please try again. ("+e.message+")";state.view="form";
  }
  render();
}

          p({style:{fontSize:"15px",color:B.textMid,lineHeight:"1.6",marginBottom:"24px"}},["To get a better plan, let's start fresh with more detail about what's happened today."]),
          div({style:{display:"grid",gridTemplateColumns:"1fr",gap:"10px"}},[
            btn({className:"btn-primary",onclick:()=>{state.view="form";state.result=null;state.situation="";state.recalibrating=false;state.recalibrateCount=0;state.showRestartPopup=false;render();}},["Start again →"]),
            btn({className:"btn-ghost",onclick:()=>{state.showRestartPopup=false;render();}},["Keep this plan"])
          ])
        ])
      ]);
      return overlay;
    })() : null,
    // Baby tag
    div({style:{textAlign:"center",marginBottom:"14px"}},[
      el("span",{style:{display:"inline-block",background:B.sagePale,border:"1.5px solid "+B.sageMid,borderRadius:"20px",padding:"5px 16px",fontSize:"13px",fontWeight:"600",color:B.navy}},[
        r.babyName+" · "+r.ageStr
      ])
    ]),
    // Headline
    el("h2",{className:"serif headline",style:{fontSize:"26px",fontWeight:"700",lineHeight:"1.3",color:B.navy,textAlign:"center",margin:"0 0 16px"}},[r.headline]),
    // Age info
    r.ageInfo?p({style:{fontSize:"15px",color:B.textMid,lineHeight:"1.65",textAlign:"center",margin:"0 auto 22px",maxWidth:"500px"}},[r.ageInfo]):null,
    // Stats
    div({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"12px",marginBottom:"20px"}},[
      statCard(r.stats[0].label,r.stats[0].value),
      statCard(r.stats[1].label,r.stats[1].value),
      statCard(r.stats[2].label,r.stats[2].value)
    ]),
    // Steps card
    div({style:{background:B.white,border:"1.5px solid "+B.border,borderRadius:"16px",padding:"20px 22px",marginBottom:"14px",boxShadow:"0 2px 10px rgba(45,95,110,0.06)"}},[
      div({style:{fontSize:"13px",fontWeight:"700",letterSpacing:"0.06em",textTransform:"uppercase",color:B.sage,marginBottom:"16px"}},["Your plan for today"]),
      ...stepEls
    ]),
    // Bedtime card
    div({style:{background:B.navy,borderRadius:"16px",padding:"20px 22px",marginBottom:"24px"}},[
      div({style:{fontSize:"11px",fontWeight:"700",letterSpacing:"0.12em",textTransform:"uppercase",color:B.sage,marginBottom:"10px"}},["Bedtime guidance"]),
      p({style:{fontSize:"15px",lineHeight:"1.75",color:"rgba(255,255,255,0.92)",margin:"0"}},[r.bedtime])
    ]),

    // Recalibrate section
    (function(){
      if(state.recalibrating){
        const ta=document.createElement("textarea");
        ta.className="inp";
        ta.style.minHeight="90px";
        ta.style.marginBottom="12px";
        ta.placeholder="e.g. She actually fell asleep at 10am not 9:30, or the nap only lasted 20 minutes...";
        ta.value=state.recalibrateInput;
        ta.addEventListener("input",e=>{state.recalibrateInput=e.target.value;});
        const box=div({id:"recalibrate-box",style:{background:B.sagePale,border:"1.5px solid "+B.sageMid,borderRadius:"16px",padding:"20px 22px",marginBottom:"16px"}},[
          div({style:{fontSize:"13px",fontWeight:"700",color:B.navy,marginBottom:"10px"}},["Tell us what didn't quite fit and we'll adjust the plan:"]),
          ta,
          div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginTop:"4px"}},[
            btn({className:"btn-primary",onclick:recalibrate,style:{padding:"13px 16px",fontSize:"15px"}},["Update my plan →"]),
            btn({className:"btn-ghost",onclick:()=>{state.recalibrating=false;state.recalibrateInput="";render();},style:{padding:"13px 16px",fontSize:"15px"}},["Cancel"])
          ]),
          state.error?div({style:{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:"8px",padding:"10px 14px",fontSize:"14px",color:"#B91C1C",marginTop:"10px"}},[state.error]):null
        ]);
        return box;
      }
      return btn({className:"btn-ghost",onclick:()=>{state.recalibrating=true;state.error="";render();},style:{marginBottom:"12px",color:B.navy,borderColor:B.sageMid,fontWeight:"600"}},["🔄  Not quite right? Give us more information"]);
    })(),
    tryAgainBtn,
    p({style:{textAlign:"center",fontSize:"13px",color:B.textLight,lineHeight:"1.6",marginTop:"14px",marginBottom:"22px"}},["Your nap maths plan is generated using the Let's Sleep methodology."]),
    renderPromo(),
    renderFooter()
  ]);
}

function renderPromo(){
  return div({style:{background:"#2D5F6E",borderRadius:"16px",padding:"26px 24px",textAlign:"center",marginBottom:"24px"}},[
    div({style:{fontSize:"11px",fontWeight:"700",letterSpacing:"0.14em",textTransform:"uppercase",color:"#8BBFB8",marginBottom:"12px"}},["P.S."]),
    p({style:{fontFamily:"'Playfair Display',Georgia,serif",fontSize:"18px",fontWeight:"700",color:"#fff",lineHeight:"1.45",margin:"0 0 20px"}},[
      "Want to learn how to teach your baby to self-settle in ",
      el("span",{style:{color:"#F472A8"}},["7 days or less?"])
    ]),
    el("a",{href:"https://letsleep.samcart.com/products/7-days",target:"_blank",rel:"noopener noreferrer",style:{display:"inline-block",background:"#fff",color:"#2D5F6E",fontSize:"13px",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",textDecoration:"none",padding:"13px 24px",borderRadius:"30px"}},["Click here to learn more ›"])
  ]);
}

function renderFooter(){
  return div({style:{borderTop:"1.5px solid #D4E6E3",paddingTop:"26px",paddingBottom:"36px",textAlign:"center"}},[
    p({style:{fontSize:"14px",color:"#8AACB4",lineHeight:"1.7",maxWidth:"540px",margin:"0 auto 16px"}},["This is a guide, it's not prescriptive. Every baby is different — trust your intuition and adapt as you go."]),
    p({style:{fontSize:"12px",color:"#A0BEC2",fontStyle:"italic",lineHeight:"1.75",maxWidth:"540px",margin:"0 auto 18px"}},["This tool provides routine suggestions based on AI analysis and general sleep guidance. It does not replace personalised medical or paediatric advice and does not guarantee specific sleep outcomes. Every baby is different — always consult your GP or maternal and child health nurse for individual concerns. By using this tool, you agree not to hold Let's Sleep liable for any outcomes."]),
    p({style:{fontSize:"13px",color:"#8AACB4",fontWeight:"500"}},["© Let's Sleep 2026, All Rights Reserved."])
  ]);
}

// ── Main render ─────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const body=div({className:"body",style:{maxWidth:"700px",margin:"0 auto",padding:"30px 20px 0"}}, [
    state.view==="form"    ? renderForm()    :
    state.view==="loading" ? renderLoading() :
                             renderResults()
  ]);
  app.append(renderHeader(), body);
  if(!state.recalibrating){
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    // Scroll to the recalibrate box
    setTimeout(()=>{
      const el=document.getElementById("recalibrate-box");
      if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    },50);
  }
}

// Init
(function init(){
  const s=loadSaved();
  if(s.name)    state.name=s.name;
  if(s.years)   state.years=s.years;
  if(s.months)  state.months=s.months;
  if(s.weeks)   state.weeks=s.weeks;
  if(s.wakeTime)state.wakeTime=s.wakeTime;
  if(s.nap1)    state.nap1=s.nap1;
  if(s.nap2)    state.nap2=s.nap2;
  if(s.nap3)    state.nap3=s.nap3;
  if(s.bedTime) state.bedTime=s.bedTime;
  render();
})();
</script>
</body>
</html>
