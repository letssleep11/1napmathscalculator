<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nap Maths Calculator — Let's Sleep</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F8FAF9; font-family: 'DM Sans', -apple-system, sans-serif; }
textarea { resize: vertical; }
@keyframes ls-spin { to { transform: rotate(360deg); } }
@keyframes ls-fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.ls-fade { animation: ls-fade 0.35s ease both; }
.ls-inp:focus { border-color: #2D5F6E !important; box-shadow: 0 0 0 3px #EDF5F4 !important; }
.ls-btn-primary { transition: background 0.2s; }
.ls-btn-primary:hover { background: #244e5c !important; }
.ls-btn-ghost:hover { background: #EDF5F4 !important; }
.ls-step + .ls-step { border-top: 1.5px solid #D4E6E3; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const B = {
  navy:      "#2D5F6E",
  navyHover: "#244e5c",
  sage:      "#8BBFB8",
  sagePale:  "#EDF5F4",
  sageMid:   "#C5DED9",
  white:     "#FFFFFF",
  cream:     "#F8FAF9",
  text:      "#1A3440",
  textMid:   "#4A6670",
  textLight: "#8AACB4",
  border:    "#D4E6E3",
  borderDark:"#B0CEC9",
};

const SYSTEM_PROMPT = `You are Jazz Kostov, a registered midwife, maternal and child health nurse, and certified sleep consultant. Author of "Let's Sleep: The First Year". You have worked with 3000+ families. Your tone is warm, direct, empathetic, non-judgmental, and authority-led. You speak like a trusted expert friend.

AGE AWAKE WINDOWS & NAP DATA:
4m: 3 naps, awake window 1h45–2h, bedtime awake window 1h20–1h45, bed ~6:15–6:30pm
5m: 3 naps, awake window 1h45–2h, bedtime awake window 1h20–1h45, bed ~7pm
6m: 2–3 naps, awake window 2h30, bedtime awake window 1h30–1h45, bed ~6:30–6:45pm
7m: 2–3 naps, awake window 2h30, bedtime awake window 1h45 (3–3.5h if no 3rd nap), bed ~6:30–6:45pm
8m: 2 naps, awake window 2h30–2h45, bedtime awake window 3h20–3h30, bed ~6:30–6:45pm
9m: 2 naps, awake window 2h30–3h, bedtime awake window 3h30–3h45, bed ~6:30–6:45pm
10m: 2 naps, awake window 2h30–3h, bedtime awake window 3h45–4h, bed ~6:45–7pm
11m: 2 naps, awake window 2h30–3h, bedtime awake window 3h45–4h, bed ~6:45–7pm
12m: 2 naps (morning 30 min + lunch 2–2.5h), awake window 2h30–3h, bed ~6:45–7pm. Morning nap drops between 15–18 months.
18m: 1 nap (lunch nap 2–2.5h at 12–12:30pm), bed ~6:45–7pm. Most toddlers have dropped the morning nap by 18 months.
2yr: 1 nap (lunch nap 1.5–2h at 12:30pm) or quiet time if nap dropped, bed ~7–7:15pm. Start capping nap at 90 min to protect night sleep. If nap dropped around 2.5 years, bring bedtime to 6:30–6:45pm.

12 MONTH ROUTINE (reference):
Wake 7am, morning nap 9:30am (30 min), wake 10am, lunch nap 12:45–1pm (2–2.5h), wake 2:45–3pm, bedtime 6:45–7pm.
Morning nap drops 15–18 months — on no-morning-nap days bring lunch nap to 12/12:15pm temporarily.

18 MONTH ROUTINE (reference):
Wake 7am, lunch nap 12–12:30pm (2–2.5h), wake 2:30–3pm, bedtime 6:45–7pm.
If lunch nap moved earlier due to dropping morning nap, gradually push back to 12:30pm as toddler adjusts.

2 YEAR ROUTINE (reference):
Wake 7am, lunch nap or quiet time 12:30pm (1.5–2h), wake 2:30pm, bedtime 7–7:15pm.
Reduce nap to 90 min at 2 years. If nap dropped (~2.5 years), bedtime 6:30–6:45pm.

TROUBLESHOOTING RULES:
BRIDGING NAPS: 10–15 min assisted nap (pram/car/carrier/held). Only for babies under 7 months. Must be offered exactly halfway between when baby woke and the next desired nap time — NOT halfway between wake time and 6am. For example: woke 5am, next nap 9:30am → bridging nap at 7:15–7:30am. Must be at least 45–60 min before the next nap. Best done in pram, car, carrier or held.

4–6 MONTH RULES:
Early wake before 6:30am: offer bridging nap halfway between wake time and morning nap. If refused, move morning nap 10–15 min earlier. Never before 8:45am.
Morning nap refused (not asleep by 10/10:15am): offer assisted nap 15–20 min between 10–11am, then lunch 10–15 min earlier. If also refused, offer lunch 20–30 min earlier.
Morning nap early: let baby sleep 10–15 extra min. If woke before 9:30am, offer bridging nap halfway to lunch.
Morning nap late: wake by 10:15–10:30am even if only 15–20 min. If not asleep until 10:30am: cap at 15–20 min, treat as bridging, offer lunch usual or slightly earlier.
Lunch nap short/early: bridging nap 2:30–3pm, then 3rd nap 4–5pm.
Lunch nap late: wake by 2:30pm to fit 3rd nap.
3rd nap refused: keep trying until 5/5:15pm, then early bedtime 6/6:15pm.
3rd nap short (under 15–20 min): bedtime 6/6:15pm.

6–8 MONTH RULES:
Early wake under 7 months: bridging nap halfway to morning nap. If not asleep by 8/8:15am, morning nap at 9/9:15am.
Early wake over 7 months: morning nap at 9:15am. No bridging nap.
Morning nap refused: assisted nap 15–20 min between 10–11am, then lunch 10–15 min earlier. If both refused, lunch at 11:45am/12:15pm.
Morning nap early: sleep 10–15 min extra (cap 45 min). If woke before 9:30am, don't offer lunch before 12/12:30pm.
Morning nap late: wake by 10:15–10:30am. If not asleep until 10:30am, cap at 15 min.
Lunch short/early: 3rd nap at 3:45–4pm, wake after 30 min, bedtime 6/6:15pm.
Lunch late: let sleep to 3pm, skip 3rd nap, bedtime 6/6:30pm.
Lunch refused: bridging nap 2:30–2:45pm, 3rd nap 4–5pm (cap 30 min), bedtime 6/6:15pm.
3rd nap refused: keep trying until 5/5:15pm, bedtime 6/6:15pm.

8–12 MONTH RULES:
Early wake: keep morning nap at usual time, no earlier than 9:15am.
Morning nap early: offer lunch 10–20 min earlier.
Morning nap late: wake by 10:15–10:30am, push lunch back 10–15 min.
Morning refused (8–10m): assisted nap 15 min between 10–11am, then lunch 11:45am–12pm.
Morning refused (10–12m): if not asleep by 10:30am, get up, offer lunch 11:50am–12pm.
Lunch short/early (8–10m): 10–15 min 3rd nap between 4–5pm.
Lunch short/early (10–12m): early bedtime 6/6:15pm.
Lunch late: wake by 3/3:15pm, bedtime 3.5 hours later.
Lunch refused: short 15–20 min nap 4–5pm, bedtime 6/6:15pm.

12 MONTH RULES:
Early wake: keep morning nap at 9:30am. Do not offer before 9:15am.
Morning nap refused: skip it, offer lunch nap at 12/12:15pm (earlier than usual).
Lunch nap short/early (woke before 2pm): offer early bedtime 6/6:30pm.
Lunch nap late: wake by 3pm, bedtime 3.5 hours later.
Lunch refused: offer early bedtime 6/6:15pm.
Morning nap dropping (15–18m transition): on days they won't take morning nap, bring lunch nap to 12/12:15pm temporarily. Gradually push back to 12:45–1pm as they adjust.

18 MONTH RULES (1 nap only):
Morning nap is dropped. Single lunch nap at 12–12:30pm.
Early wake: keep lunch nap at usual time, no earlier than 11:45am.
Lunch nap refused: early bedtime 6:30pm.
Lunch nap short (under 60 min): early bedtime 6:30pm.
Lunch nap late: wake by 3pm, bedtime 3.5 hours later.

2 YEAR RULES (1 nap or quiet time):
Lunch nap at 12:30pm, cap at 90 min.
Early wake: keep nap at usual time.
Nap refused: early bedtime 6:30–6:45pm. Offer quiet time instead.
Nap short (under 45 min): early bedtime 6:30pm.
Nap dropping (~2.5 years): bring bedtime to 6:30–6:45pm permanently.

ALWAYS: If troubleshooting goes to plan and baby is on track for their usual 3rd nap timing, bedtime can be at the usual time. If things have continued to not go to plan, an early bedtime is the very best tool. Every day is a fresh start — tomorrow go back to usual routine as if today didn't happen. Be mindful not to get baby up early as this reinforces early waking.
TIP1 GUIDANCE: If baby is fighting naps today, lean on motion — pram or car are completely valid, not creating bad habits, just meeting them where they're at.
TIP2 GUIDANCE: Watch for overtiredness cues — red eyebrows, glazed eyes, or frantic energy. On early wake days these can come faster than usual, trust what you see over the clock.
TIP3 GUIDANCE: One early morning does not set a new pattern. Every day is a fresh start and tomorrow go back to the usual routine as if today didn't happen. Be mindful not to get baby up early as this reinforces early waking.

IMPORTANT WORDING RULES:
- HEADLINE must always be warm and addressed to the PARENT, never the baby. Vary the headline each time — do NOT always use the same phrase. Choose from openers like these and adapt naturally to the situation described:
  "Ahh all good! Let's make a plan for the rest of [name]'s day."
  "Don't stress — this happens! Here's how I'd handle the rest of [name]'s day."
  "You've got this! Let's work out the rest of [name]'s day together."
  "Totally fixable — here's your plan for the rest of [name]'s day."
  "This is so common and completely manageable. Here's what I'd do with [name] today."
  "No need to panic — let's just adjust and keep moving. Here's the plan."
  "Every parent has days like this — here's how to course correct for [name]."
  "One off day doesn't mean anything is broken. Here's your plan."
  Always write in Jazz's warm, direct, non-judgmental voice. Never say the parent is doing great for catching something.
- NEVER mention food, milk, feeds, solids, lunch (as a meal), or any feeding advice. This tool is ONLY about nap and sleep timing.
- For lunch nap: always say "Wake by 2:30pm at the latest so there's room for the 3rd nap." Nothing else about timing or food.
- For 3rd nap after a good lunch nap: always say "offer a 3rd nap at around 4:30pm as per usual."
- For babies 8 months and older: do NOT include a 3rd nap step. 8 month olds are on 2 naps only — morning nap and lunch nap. Never suggest a 3rd nap for babies 8 months+.
- Keep BEDTIME to 1–2 short sentences maximum. Simple and direct. Never add phrases like "it's not a punishment" or "it's just smart sleep" — just state the bedtime plainly and warmly.
- When describing what to do at bedtime, always say "move straight into her usual evening routine (feed, bath, top up, bedtime)" — this is the only context where feed/bath is mentioned.

RESPONSE FORMAT — use these exact markers, no markdown, no asterisks:
HEADLINE: [one warm sentence addressed to the parent]
AGEINFO: [one sentence about age group and what it means for today]
STEPS: [numbered steps, each on its own line, e.g. "1. At 7:30am offer a 10–15 minute bridging nap..."]
BEDTIME: [1–2 short sentences only]`;

function parseResponse(text, ageMonths) {
  const get = (key) => {
    const re = new RegExp(key + ':\\s*([\\s\\S]+?)(?=\\n[A-Z]+:|$)');
    const m = text.match(re);
    return m ? m[1].trim() : "";
  };
  const stepsRaw = get("STEPS");
  const steps = stepsRaw.split(/\n/).map(s => s.replace(/^\d+\.\s*/, "").trim()).filter(Boolean);
  const mo = parseInt(ageMonths) || 6;
  return {
    headline: get("HEADLINE"),
    ageInfo:  get("AGEINFO"),
    steps,
    bedtime:  get("BEDTIME"),
    stats: [
      { label: "Age group",     value: mo <= 6 ? "4–6 months" : mo <= 8 ? "6–8 months" : mo <= 12 ? "8–12 months" : mo <= 18 ? "12–18 months" : "18m–2 years" },
      { label: "Awake windows", value: mo <= 5 ? "1h 45m – 2h" : mo <= 6 ? "2h 30m" : mo <= 7 ? "2h 30m" : mo <= 12 ? "2h 30m – 3h" : mo <= 18 ? "5–6h (1 nap)" : "5–6h (1 nap)" },
      { label: "Naps today",    value: mo <= 7 ? "2–3" : mo <= 14 ? "2" : mo <= 20 ? "1" : "1 or quiet time" },
    ]
  };
}

function Spinner() {
  return (
    React.createElement('div', { style: { display:"flex", flexDirection:"column", alignItems:"center", gap:24, padding:"64px 0" } },
      React.createElement('div', { style: {
        width:56, height:56, borderRadius:"50%",
        border:"3px solid " + B.sageMid,
        borderTopColor: B.navy,
        animation:"ls-spin 0.85s linear infinite"
      }}),
      React.createElement('div', { style: { textAlign:"center" } },
        React.createElement('div', { style: { fontFamily:"'Playfair Display', Georgia, serif", fontSize:22, color:B.navy, fontWeight:700, marginBottom:6 } }, "Working out your plan…"),
        React.createElement('div', { style: { fontSize:13, color:B.textLight, letterSpacing:"0.08em", textTransform:"uppercase" } }, "This will just take a few seconds")
      )
    )
  );
}

function StatCard({ label, value }) {
  return React.createElement('div', {
    style: {
      background: B.white,
      border: "1.5px solid " + B.border,
      borderRadius:12, padding:"14px 16px",
      textAlign:"center",
      boxShadow:"0 1px 4px rgba(45,95,110,0.06)"
    }
  },
    React.createElement('div', { style: { fontSize:10, color:B.textLight, textTransform:"uppercase", letterSpacing:"0.1em", fontWeight:700, marginBottom:6 } }, label),
    React.createElement('div', { style: { fontSize:17, fontWeight:700, color:B.navy } }, value)
  );
}

function App() {
  const [view,      setView]      = useState("form");
  const [name,      setName]      = useState("");
  const [months,    setMonths]    = useState("");
  const [weeks,     setWeeks]     = useState("");
  const [routine,   setRoutine]   = useState("");
  const [situation, setSituation] = useState("");
  const [result,    setResult]    = useState(null);
  const [error,     setError]     = useState("");
  const topRef = useRef(null);

  useEffect(() => {
    if (topRef.current) topRef.current.scrollIntoView({ behavior:"smooth" });
  }, [view]);

  async function submit() {
    if (!routine.trim() || !situation.trim()) {
      setError("Please fill in both your usual routine and what happened today.");
      return;
    }
    const mo = parseInt(months) || 0;
    if (months && mo < 4) {
      setError("This tool is designed for babies 4 months and older.");
      return;
    }
    setError("");
    setView("loading");
    const babyName = name.trim() || "your baby";
    const ageStr   = months ? (months + " months" + (weeks && weeks !== "0" ? " and " + weeks + " weeks" : "")) : "unknown age";
    const userMsg  = "Baby name: " + babyName + "\nAge: " + ageStr + "\nUsual routine: " + routine + "\nWhat happened today: " + situation + "\n\nPlease give a full troubleshooting plan for the rest of today.";

    try {
      const res = await fetch("/api/plan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM_PROMPT,
          messages: [{ role: "user", content: userMsg }]
        })
      });

      if (!res.ok) {
        throw new Error("API error: " + res.status);
      }

      const data = await res.json();
      const text = (data.content || []).map(function(b) { return b.text || ""; }).join("");

      if (!text) throw new Error("Empty response");

      const parsed = parseResponse(text, months);
      parsed.babyName = babyName;
      parsed.ageStr   = ageStr;
      setResult(parsed);
      setView("results");
    } catch(err) {
      console.error(err);
      setError("Something went wrong — please try again in a moment.");
      setView("form");
    }
  }

  const lbl = {
    display:"block", fontSize:17, fontWeight:700,
    color:B.text, marginBottom:8, letterSpacing:"0em",
  };
  const hint = { fontSize:13, color:B.textLight, marginTop:5, lineHeight:1.4 };
  const inp = {
    width:"100%", padding:"14px 16px",
    border:"1.5px solid " + B.border,
    borderRadius:10, background:B.white,
    color:B.text, fontFamily:"inherit",
    fontSize:16, outline:"none", lineHeight:1.5,
    transition:"border-color 0.15s, box-shadow 0.15s",
  };

  return React.createElement('div', { ref: topRef, style: {
    minHeight:"100vh", background:B.cream,
    fontFamily:"'DM Sans', -apple-system, sans-serif", color:B.text,
  }},

    // HEADER
    React.createElement('div', { style: {
      background: B.white, borderBottom:"2px solid " + B.sageMid,
      padding:"28px 24px 24px", textAlign:"center",
    }},
      React.createElement('div', { style: { fontFamily:"'Playfair Display', serif", fontSize:18, marginBottom:20 } },
        React.createElement('span', { style: { color: B.navy, fontWeight:700 } }, "let's "),
        React.createElement('span', { style: { color: B.sage, fontWeight:400, letterSpacing:"0.12em" } }, "sleep")
      ),
      React.createElement('h1', { style: {
        fontFamily:"'Playfair Display', Georgia, serif",
        fontSize:42, fontWeight:700, color:"#E0126B",
        lineHeight:1.15, marginBottom:16,
      }}, "Nap Maths Calculator"),
      React.createElement('p', { style: {
        fontSize:16, color:B.textMid, lineHeight:1.75,
        maxWidth:600, margin:"0 auto",
      }}, "Something not quite gone to plan in your baby's day? Don't stress! We'll help you figure out how to make a plan forward for the day! All you need to do is answer the questions below and we'll sort out the rest.")
    ),

    // BODY
    React.createElement('div', { style: { maxWidth:680, margin:"0 auto", padding:"36px 24px 0" } },

      // FORM
      view === "form" && React.createElement('div', { className:"ls-fade" },
        React.createElement('h2', { style: {
          fontFamily:"'Playfair Display', Georgia, serif",
          fontSize:24, fontWeight:700, color:B.text,
          marginBottom:24, textAlign:"center",
        }}, "Step 1: Fill Out This Info Below First"),

        React.createElement('div', { style: {
          background:B.white, border:"1.5px solid " + B.border,
          borderRadius:16, padding:"32px 32px 28px",
          boxShadow:"0 2px 12px rgba(45,95,110,0.07)", marginBottom:24,
        }},

          // Name + Age row
          React.createElement('div', { style: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:24, marginBottom:28 } },
            React.createElement('div', null,
              React.createElement('label', { style: lbl }, "Baby's name"),
              React.createElement('input', { className:"ls-inp", style: inp, type:"text", value:name, onChange:function(e){setName(e.target.value)}, placeholder:"e.g. Olive" })
            ),
            React.createElement('div', null,
              React.createElement('label', { style: lbl }, "Baby's age"),
              React.createElement('div', { style: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 } },
                React.createElement('input', { className:"ls-inp", style: Object.assign({}, inp, {textAlign:"center"}), type:"number", value:months, onChange:function(e){setMonths(e.target.value)}, min:"4", max:"24", placeholder:"months" }),
                React.createElement('input', { className:"ls-inp", style: Object.assign({}, inp, {textAlign:"center"}), type:"number", value:weeks, onChange:function(e){setWeeks(e.target.value)}, min:"0", max:"3", placeholder:"+ weeks" })
              )
            )
          ),

          React.createElement('div', { style: { height:"1.5px", background:B.border, marginBottom:28 } }),

          // Routine
          React.createElement('div', { style: { marginBottom:28 } },
            React.createElement('label', { style: lbl }, "Usual daily routine"),
            React.createElement('textarea', { className:"ls-inp", style: Object.assign({}, inp, {minHeight:110}), value:routine, onChange:function(e){setRoutine(e.target.value)}, placeholder:"e.g. Wake 7am, nap 1 at 9:30am for 45 mins, lunch nap 12:45–2:30pm, catnap 4:40–5pm, bed 6:45pm" }),
            React.createElement('p', { style: hint }, "The more detail you give, the more accurate your plan will be.")
          ),

          // Situation
          React.createElement('div', null,
            React.createElement('label', { style: lbl }, "What's happened today?"),
            React.createElement('textarea', { className:"ls-inp", style: Object.assign({}, inp, {minHeight:120}), value:situation, onChange:function(e){setSituation(e.target.value)}, placeholder:"e.g. Baby woke at 5am instead of 7am and refused the morning nap. It's now 11am and I'm not sure what to do for the rest of the day..." }),
            React.createElement('p', { style: hint }, "Describe the situation as it currently stands — include what time it is now if helpful.")
          )
        ),

        error && React.createElement('div', { style: {
          background:"#FEF2F2", border:"1.5px solid #FECACA",
          borderRadius:10, padding:"13px 18px",
          fontSize:15, color:"#B91C1C", marginBottom:20
        }}, error),

        React.createElement('button', {
          className:"ls-btn-primary",
          onClick: submit,
          style: {
            width:"100%", padding:"18px 24px",
            background:B.navy, color:B.white,
            border:"none", borderRadius:12,
            fontSize:18, fontWeight:700,
            cursor:"pointer", fontFamily:"inherit",
            letterSpacing:"0.01em", marginBottom:16,
          }
        }, "Work Out My Plan →"),

        React.createElement('p', { style: {
          textAlign:"center", fontSize:14,
          color:B.textLight, lineHeight:1.6, marginBottom:24,
        }}, "Your nap maths plan is generated using the Let's Sleep methodology."),

        React.createElement(Footer)
      ),

      // LOADING
      view === "loading" && React.createElement(Spinner),

      // RESULTS
      view === "results" && result && React.createElement('div', { className:"ls-fade" },

        React.createElement('div', { style: { textAlign:"center", marginBottom:16 } },
          React.createElement('span', { style: {
            display:"inline-block",
            background:B.sagePale, border:"1.5px solid " + B.sageMid,
            borderRadius:20, padding:"5px 16px",
            fontSize:14, fontWeight:600, color:B.navy, letterSpacing:"0.02em"
          }}, result.babyName + " · " + result.ageStr)
        ),

        React.createElement('h2', { style: {
          fontFamily:"'Playfair Display', Georgia, serif",
          fontSize:28, fontWeight:700, lineHeight:1.3,
          color:B.navy, textAlign:"center", margin:"0 0 18px"
        }}, result.headline),

        result.ageInfo && React.createElement('p', { style: {
          fontSize:15, color:B.textMid, lineHeight:1.65,
          textAlign:"center", margin:"0 auto 26px", maxWidth:500, display:"block"
        }}, result.ageInfo),

        React.createElement('div', { style: { display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:24 } },
          result.stats.map(function(s, i) { return React.createElement(StatCard, { key:i, label:s.label, value:s.value }); })
        ),

        React.createElement('div', { style: {
          background:B.white, border:"1.5px solid " + B.border,
          borderRadius:16, padding:"24px 28px", marginBottom:16,
          boxShadow:"0 2px 10px rgba(45,95,110,0.06)"
        }},
          React.createElement('div', { style: { fontSize:15, fontWeight:700, letterSpacing:"0.05em", textTransform:"uppercase", color:B.sage, marginBottom:18 } }, "Your plan for today"),
          result.steps.map(function(step, i) {
            return React.createElement('div', { key:i, className:"ls-step", style: { display:"flex", gap:16, alignItems:"flex-start", padding:"12px 0" } },
              React.createElement('div', { style: {
                minWidth:30, height:30, borderRadius:"50%",
                background:B.navy, color:B.white,
                fontSize:13, fontWeight:700,
                display:"flex", alignItems:"center", justifyContent:"center",
                flexShrink:0, marginTop:1
              }}, i+1),
              React.createElement('div', { style: { fontSize:15, lineHeight:1.75, color:B.text, paddingTop:4 } }, step)
            );
          })
        ),

        React.createElement('div', { style: {
          background:B.navy, borderRadius:16, padding:"22px 28px", marginBottom:28
        }},
